# Dependabot version updates (tính năng có sẵn của GitHub, không phải Dependabot CLI/M5).
# PR do Dependabot mở do người dùng review và merge; không bật auto-merge.
version: 2
updates:
  - package-ecosystem: "uv" # file mà uv đọc: chưa xác nhận trong tài liệu GitHub
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      # dependency-type không dùng được trong groups cho uv, nên gom theo tên.
      dev-tools:
        patterns: ["pytest*", "ruff", "mypy*", "types-*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
