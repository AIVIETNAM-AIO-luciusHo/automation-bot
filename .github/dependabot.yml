# Dependabot version updates (tính năng có sẵn của GitHub, không phải Dependabot CLI/M5).
# PR do Dependabot mở do người dùng review và merge; không bật auto-merge.
version: 2
updates:
  - package-ecosystem: "uv" # đọc pyproject.toml + uv.lock
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # Label chưa tồn tại trong repo sẽ bị Dependabot bỏ qua (không tự tạo).
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # dependency-type không dùng được trong groups cho uv, nên gom theo tên.
      dev-tools:
        patterns: ["pytest*", "ruff", "mypy*", "types-*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels: ["dependencies"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns: ["*"]
