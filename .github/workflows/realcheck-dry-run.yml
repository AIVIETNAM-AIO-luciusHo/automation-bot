name: Realcheck dry-run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --no-dev
      - name: Chuẩn bị và kiểm tra fixture
        env:
          REALCHECK_ASSIGNEE: ${{ vars.REALCHECK_ASSIGNEE }}
        run: |
          workspace="$RUNNER_TEMP/realcheck"
          mkdir -p "$workspace"
          cp tests/fixtures/realcheck/tasks.md "$workspace/tasks.md"
          uv run --no-sync python - "$workspace/members.yaml" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          from github_bot.identities.resolver import GITHUB_LOGIN

          login = os.environ["REALCHECK_ASSIGNEE"]
          if not GITHUB_LOGIN.fullmatch(login):
              sys.exit("Thiếu hoặc sai định dạng biến Actions REALCHECK_ASSIGNEE.")
          members = {"TV01": {"display_name": "Thành viên thử nghiệm", "github": login}}
          Path(sys.argv[1]).write_text(json.dumps({"members": members}), encoding="utf-8")
          PY
          uv run --no-sync github-bot issues validate --workspace "$workspace" \
            --input tasks.md --members members.yaml
      - name: Lập plan chỉ đọc
        env:
          GITHUB_TOKEN: ${{ secrets.REALCHECK_READ_TOKEN }}
        run: |
          uv run --no-sync github-bot issues plan --workspace "$RUNNER_TEMP/realcheck" \
            --input tasks.md --members members.yaml --repo AIVIETNAM-AIO-luciusHo/realcheck \
            --max-tasks 1 --output-dir preview
      - name: Xác nhận SKIP issue thử nghiệm
        run: |
          uv run --no-sync python - "$RUNNER_TEMP/realcheck/preview/plan.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          items = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["items"]
          if len(items) != 1 or any(
              (item["task_id"], item["action"], item["issue_number"]) != ("TASK-012", "SKIP", 202)
              for item in items
          ):
              sys.exit("Plan phải có đúng một SKIP cho TASK-012 tại issue #202. Báo Leader.")
          PY
      - name: Tải lên preview
        uses: actions/upload-artifact@v4
        with:
          name: realcheck-dry-run
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/realcheck/preview/PREVIEW.md
            ${{ runner.temp }}/realcheck/preview/PREVIEW.json
            ${{ runner.temp }}/realcheck/preview/plan.json
